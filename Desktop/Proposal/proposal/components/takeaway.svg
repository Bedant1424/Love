<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 
    TAKEAWAY COMPONENT — NATIVE SVG VERSION
    ========================================
    Usage: Copy this <g> block into your page SVG.
    Replace:
      - [INSERT_Y_COORDINATE] with the desired y position
      - [INSERT_TEXT] with the takeaway message
    
    Layout:
      x=42, width=511, height=64, rx=8
      Blue left accent: 3px solid #2563EB
      Text: Inter Medium 11pt, #111827, centered
  -->
  <g id="takeawayComponent">
    <rect x="42" y="[INSERT_Y_COORDINATE]" width="511" height="64" rx="8"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <rect x="42" y="[INSERT_Y_COORDINATE+2]" width="3" height="60" rx="0" fill="#2563EB"/>
    <text x="297.5" y="[INSERT_Y_CENTER]"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="500"
          font-size="11"
          fill="#111827">[INSERT_TEXT]</text>
  </g>
</svg>
