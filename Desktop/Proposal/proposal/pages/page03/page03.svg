<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01/02 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- 595pt × 842pt (210mm × 297mm)                                   -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Brand left, page identifier right                  -->
  <!-- Consistent with page 02 header pattern                           -->
  <!-- ================================================================ -->
  <text x="42" y="40"
        font-family="'Poppins', sans-serif"
        font-weight="600"
        font-size="8"
        fill="#2563EB">LeadFlow</text>

  <text x="553" y="36"
        text-anchor="end"
        font-family="'Poppins', sans-serif"
        font-weight="600"
        font-size="7.5"
        fill="#111827">Page 03</text>
  <text x="553" y="46"
        text-anchor="end"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="7"
        fill="#9CA3AF">Current Challenges</text>

  <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>

  <!-- ================================================================ -->
  <!-- HERO SECTION                                                     -->
  <!-- Poppins Bold 24pt title, Inter 9.5pt subtitle                    -->
  <!-- ================================================================ -->
  <text x="42" y="84"
        font-family="'Poppins', sans-serif"
        font-weight="700"
        font-size="24"
        fill="#111827">Current Challenges</text>

  <text x="42" y="102"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="9.5"
        fill="#6B7280">Understanding the recruitment workflow that needs to change.</text>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- Inter Regular 10pt, Slate 900, max ~70 chars/line                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">Recruitment teams managing leads through manual tools face</text>
  <text x="42" y="144"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">predictable challenges that reduce speed, visibility, and accountability.</text>

  <!-- ================================================================ -->
  <!-- SECTION LABEL                                                     -->
  <!-- ================================================================ -->
  <text x="42" y="172"
        font-family="'Poppins', sans-serif"
        font-weight="600"
        font-size="11"
        fill="#111827">Key Operational Challenges</text>

  <!-- ================================================================ -->
  <!-- CHALLENGE GRID — Dominant Visual (3×3)                            -->
  <!-- 9 white cards, 159×120pt, 17pt h-gap, 20pt v-gap                 -->
  <!-- Columns: x=42, x=218, x=394                                     -->
  <!-- Rows: y=190, y=330, y=470                                        -->
  <!-- ================================================================ -->

  <!-- ============================================================== -->
  <!-- ROW 1                                                           -->
  <!-- ============================================================== -->

  <!-- Card 1: Manual Excel Tracking -->
  <rect x="42" y="190" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide FileSpreadsheet icon -->
  <rect x="58" y="206" width="12" height="15" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="58" y1="211" x2="70" y2="211" stroke="#2563EB" stroke-width="0.8"/>
  <line x1="58" y1="216" x2="70" y2="216" stroke="#2563EB" stroke-width="0.8"/>
  <line x1="64" y1="206" x2="64" y2="221" stroke="#2563EB" stroke-width="0.8"/>
  <text x="56" y="244"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Manual Excel Tracking</text>
  <text x="56" y="260"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Leads tracked in spreadsheets</text>
  <text x="56" y="274"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">with no sync or versioning.</text>

  <!-- Card 2: WhatsApp Reporting -->
  <rect x="218" y="190" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide MessageCircle icon -->
  <circle cx="240" cy="211" r="7" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <polyline points="237,217 235,222 240,218"
            fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="232" y="244"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">WhatsApp Reporting</text>
  <text x="232" y="260"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Updates shared through chat</text>
  <text x="232" y="274"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">with no format or archive.</text>

  <!-- Card 3: Duplicate Leads -->
  <rect x="394" y="190" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide Copy icon — two overlapping rectangles -->
  <rect x="410" y="204" width="10" height="12" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <rect x="414" y="208" width="10" height="12" rx="1.5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2"/>
  <text x="408" y="244"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Duplicate Leads</text>
  <text x="408" y="260"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Same leads contacted</text>
  <text x="408" y="274"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">by multiple team members.</text>

  <!-- ============================================================== -->
  <!-- ROW 2                                                           -->
  <!-- ============================================================== -->

  <!-- Card 4: Poor Lead Ownership -->
  <rect x="42" y="330" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide UserX icon -->
  <circle cx="62" cy="347" r="3.5" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <path d="M56,358 C56,354 58,352 62,352 C66,354 68,354 68,358"
        fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="345" x2="75" y2="350" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="75" y1="345" x2="70" y2="350" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <text x="56" y="384"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Poor Lead Ownership</text>
  <text x="56" y="400"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">No clear assignment record.</text>
  <text x="56" y="414"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Leads left untracked.</text>

  <!-- Card 5: No Central Dashboard -->
  <rect x="218" y="330" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide LayoutDashboard icon -->
  <rect x="233" y="344" width="14" height="14" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="240" y1="344" x2="240" y2="358" stroke="#2563EB" stroke-width="0.8"/>
  <line x1="233" y1="351" x2="240" y2="351" stroke="#2563EB" stroke-width="0.8"/>
  <text x="232" y="384"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">No Central Dashboard</text>
  <text x="232" y="400"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">No single view of activity,</text>
  <text x="232" y="414"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">progress, or pipeline status.</text>

  <!-- Card 6: No Performance Tracking -->
  <rect x="394" y="330" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide EyeOff icon -->
  <ellipse cx="416" cy="351" rx="8" ry="5" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <circle cx="416" cy="351" r="2.5" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="410" y1="357" x2="422" y2="345" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <text x="408" y="384"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">No Performance Tracking</text>
  <text x="408" y="400"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">No way to compare output,</text>
  <text x="408" y="414"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">call volume, or conversions.</text>

  <!-- ============================================================== -->
  <!-- ROW 3                                                           -->
  <!-- ============================================================== -->

  <!-- Card 7: No Historical Reports -->
  <rect x="42" y="470" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide Clock icon -->
  <circle cx="64" cy="491" r="7" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="64" y1="491" x2="64" y2="486" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="64" y1="491" x2="68" y2="493" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <text x="56" y="524"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">No Historical Reports</text>
  <text x="56" y="540"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Past data scattered across</text>
  <text x="56" y="554"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">files with no searchable history.</text>

  <!-- Card 8: Manual Distribution -->
  <rect x="218" y="470" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide Users icon — two people -->
  <circle cx="237" cy="487" r="3" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <path d="M232,496 C232,493 234,491 237,491 C240,491 242,493 242,496"
        fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="245" cy="487" r="3" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <path d="M240,496 C240,493 242,491 245,491 C248,491 250,493 250,496"
        fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <text x="232" y="524"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Manual Distribution</text>
  <text x="232" y="540"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Leads assigned through chat,</text>
  <text x="232" y="554"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">creating delays and imbalance.</text>

  <!-- Card 9: Limited Accountability -->
  <rect x="394" y="470" width="159" height="120" rx="8"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
        filter="url(#cardShadow)"/>
  <!-- Lucide AlertTriangle icon -->
  <path d="M416,483 L424,498 L408,498 Z"
        fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="416" y1="489" x2="416" y2="493" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="416" cy="496" r="0.8" fill="#2563EB"/>
  <text x="408" y="524"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Limited Accountability</text>
  <text x="408" y="540"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">No audit trail connecting</text>
  <text x="408" y="554"
        font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">actions to individuals.</text>

  <!-- ================================================================ -->
  <!-- BUSINESS IMPACT STATEMENT                                        -->
  <!-- Inter Regular 10pt, Slate 500, centered                          -->
  <!-- ================================================================ -->
  <text x="297.5" y="622"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#6B7280">These operational gaps cost time every day.</text>
  <text x="297.5" y="638"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#6B7280">Without structured tools, teams work harder but achieve less.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY                                                     -->
  <!-- White card with blue accent bar, Inter Medium 11pt               -->
  <!-- Consistent position with page02 (y=722, height=48)               -->
  <!-- ================================================================ -->
  <g filter="url(#takeawayShadow)">
    <rect x="42" y="722" width="511" height="48" rx="8"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <rect x="42" y="722" width="3" height="48" rx="1.5" fill="#2563EB"/>
    <text x="297.5" y="750"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="500"
          font-size="11"
          fill="#111827">These challenges are the direct result of managing recruitment without a centralized platform.</text>
  </g>

  <!-- ================================================================ -->
  <!-- FOOTER                                                           -->
  <!-- Inter Regular 7pt, Slate 400                                     -->
  <!-- Consistent with pages 01/02                                      -->
  <!-- ================================================================ -->
  <text x="297.5" y="822"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="7"
        fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>

  <text x="553" y="822"
        text-anchor="end"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="7"
        fill="#9CA3AF">03</text>

</svg>
