<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>

    <!-- Card shadow — adapted for print scale -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- 595pt × 842pt (210mm × 297mm)                                   -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- ABSTRACT VISUAL ELEMENTS — Background Layer                      -->
  <!-- Subtle SaaS dashboard silhouette. Abstract only.                 -->
  <!-- No decorative gradients. No glow effects.                        -->
  <!-- Typography remains dominant. Elements at 2–7% opacity.           -->
  <!-- ================================================================ -->

  <!-- Card silhouettes — suggesting dashboard panels -->
  <rect x="385" y="478" width="130" height="80" rx="10" fill="#2563EB" opacity="0.04"/>
  <rect x="405" y="572" width="110" height="55" rx="10" fill="#2563EB" opacity="0.035"/>
  <rect x="58" y="508" width="96" height="66" rx="10" fill="#2563EB" opacity="0.03"/>
  <rect x="42" y="598" width="76" height="46" rx="8" fill="#2563EB" opacity="0.025"/>
  <rect x="490" y="540" width="60" height="90" rx="8" fill="#2563EB" opacity="0.02"/>

  <!-- Progress ring fragments — suggesting analytics -->
  <circle cx="458" cy="510" r="16" fill="none" stroke="#2563EB" stroke-width="2.5" opacity="0.055" stroke-dasharray="70 30"/>
  <circle cx="98" cy="555" r="12" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.04" stroke-dasharray="52 22"/>
  <circle cx="520" cy="590" r="9" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.035" stroke-dasharray="38 18"/>

  <!-- Bar chart fragments — suggesting data visualization -->
  <rect x="398" y="498" width="12" height="30" rx="3" fill="#2563EB" opacity="0.045"/>
  <rect x="414" y="506" width="12" height="22" rx="3" fill="#2563EB" opacity="0.04"/>
  <rect x="430" y="502" width="12" height="26" rx="3" fill="#2563EB" opacity="0.045"/>
  <rect x="446" y="508" width="12" height="20" rx="3" fill="#2563EB" opacity="0.035"/>
  <rect x="462" y="504" width="12" height="24" rx="3" fill="#2563EB" opacity="0.04"/>

  <!-- Horizontal line fragments — suggesting table rows -->
  <line x1="68" y1="530" x2="138" y2="530" stroke="#2563EB" stroke-width="1" opacity="0.03"/>
  <line x1="68" y1="545" x2="128" y2="545" stroke="#2563EB" stroke-width="1" opacity="0.025"/>
  <line x1="68" y1="560" x2="142" y2="560" stroke="#2563EB" stroke-width="1" opacity="0.02"/>

  <!-- Data point dots — suggesting scatter metrics -->
  <circle cx="74" cy="580" r="2.5" fill="#2563EB" opacity="0.05"/>
  <circle cx="94" cy="573" r="2.5" fill="#2563EB" opacity="0.04"/>
  <circle cx="114" cy="582" r="2.5" fill="#2563EB" opacity="0.035"/>
  <circle cx="490" cy="635" r="2" fill="#2563EB" opacity="0.04"/>
  <circle cx="506" cy="628" r="2" fill="#2563EB" opacity="0.035"/>
  <circle cx="522" cy="632" r="2" fill="#2563EB" opacity="0.03"/>

  <!-- ================================================================ -->
  <!-- BRAND BLOCK — Top Center                                         -->
  <!-- Margins: 50pt L/R, 56pt top                                     -->
  <!-- ================================================================ -->

  <!-- Product Name — Poppins Bold 36pt, LeadFlow Blue -->
  <text x="297.5" y="120"
        text-anchor="middle"
        font-family="'Poppins', sans-serif"
        font-weight="700"
        font-size="36"
        fill="#2563EB">LeadFlow</text>

  <!-- Subtitle — Poppins SemiBold 13pt, Slate 900 -->
  <text x="297.5" y="150"
        text-anchor="middle"
        font-family="'Poppins', sans-serif"
        font-weight="600"
        font-size="13"
        fill="#111827">Recruitment Operations Platform</text>

  <!-- Supporting Sentence — Inter Regular 11pt, Slate 500, 2 lines -->
  <text x="297.5" y="178"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="11"
        fill="#6B7280">Helping recruitment teams work faster through centralized lead management,</text>
  <text x="297.5" y="194"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="11"
        fill="#6B7280">structured workflows, and real-time visibility.</text>

  <!-- ================================================================ -->
  <!-- CLIENT INTRODUCTION BLOCK                                        -->
  <!-- 46pt gap from supporting text                                    -->
  <!-- ================================================================ -->

  <!-- Label — Inter Medium 8.5pt, uppercase, letter-spacing -->
  <text x="297.5" y="240"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="500"
        font-size="8.5"
        fill="#6B7280"
        letter-spacing="2.5">CUSTOM SOFTWARE PROPOSAL</text>

  <!-- Subtext — Inter Regular 9.5pt -->
  <text x="297.5" y="258"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="9.5"
        fill="#6B7280">Prepared exclusively for</text>

  <!-- Client Name — Poppins SemiBold 20pt, Slate 900 -->
  <text x="297.5" y="284"
        text-anchor="middle"
        font-family="'Poppins', sans-serif"
        font-weight="600"
        font-size="20"
        fill="#111827">Suryavanshi Finserv</text>

  <!-- ================================================================ -->
  <!-- METADATA CARD — Two-Column Information Card                      -->
  <!-- White, 10pt radius, 0.75px Slate 200 border, soft shadow         -->
  <!-- Width 380pt centered: x = (595-380)/2 ≈ 108                     -->
  <!-- ================================================================ -->

  <!-- Card container -->
  <rect x="108" y="318" width="380" height="106" rx="10"
        fill="#FFFFFF"
        stroke="#E5E7EB"
        stroke-width="0.75"
        filter="url(#cardShadow)"/>

  <!-- Row 1: Prepared By -->
  <text x="128" y="342"
        font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#6B7280">Prepared By</text>
  <text x="268" y="342"
        font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#111827">Bedant Arya Padhy</text>
  <line x1="128" y1="350" x2="468" y2="350" stroke="#F1F5F9" stroke-width="0.75"/>

  <!-- Row 2: Role -->
  <text x="128" y="366"
        font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#6B7280">Role</text>
  <text x="268" y="366"
        font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#111827">Product Designer &amp; Software Developer</text>
  <line x1="128" y1="374" x2="468" y2="374" stroke="#F1F5F9" stroke-width="0.75"/>

  <!-- Row 3: Date -->
  <text x="128" y="390"
        font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#6B7280">Date</text>
  <text x="268" y="390"
        font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#111827">July 2026</text>
  <line x1="128" y1="398" x2="468" y2="398" stroke="#F1F5F9" stroke-width="0.75"/>

  <!-- Row 4: Version -->
  <text x="128" y="414"
        font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#6B7280">Version</text>
  <text x="268" y="414"
        font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#111827">1.0</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY                                                     -->
  <!-- White card with blue accent bar, centered                        -->
  <!-- Inter Medium 11pt, Slate 900                                     -->
  <!-- ================================================================ -->
  <g filter="url(#takeawayShadow)">
    <rect x="80" y="694" width="435" height="38" rx="8"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <rect x="80" y="694" width="3" height="38" rx="1.5" fill="#2563EB"/>
    <text x="297.5" y="717"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="500"
          font-size="11"
          fill="#111827">Designed to help recruitment teams operate with clarity, accountability, and confidence.</text>
  </g>

  <!-- ================================================================ -->
  <!-- FOOTER                                                           -->
  <!-- Inter Regular 7pt, Slate 400                                     -->
  <!-- Confidential notice center, page number right                    -->
  <!-- ================================================================ -->
  <text x="297.5" y="822"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="7"
        fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>

  <text x="545" y="822"
        text-anchor="end"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="7"
        fill="#9CA3AF">01</text>

</svg>
