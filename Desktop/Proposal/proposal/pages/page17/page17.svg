<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01–16 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 17</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Thank You</text>
    <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- SECTION HEADER — Reused from Components Library                  -->
  <!-- ================================================================ -->
  <g id="proposalSectionHeader">
    <text x="42" y="84"
          font-family="'Poppins', sans-serif"
          font-weight="700"
          font-size="24"
          fill="#111827">Thank You</text>
    <text x="42" y="102"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="9.5"
          fill="#6B7280">We are ready to begin when you are.</text>
  </g>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">We appreciate the opportunity to partner with Suryavanshi Finserv. LeadFlow is ready to modernize</text>
  <text x="42" y="144"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">your recruitment operations and drive long-term team productivity.</text>

  <!-- ================================================================ -->
  <!-- DOMINANT VISUAL: CENTERED ELEGANT CONTACT CARD                   -->
  <!-- ================================================================ -->
  <g id="centeredContactCard" filter="url(#cardShadow)">
    <!-- Centered Card (x=142 to 453, width 311, y=190 to 390, height 200) -->
    <rect x="142" y="190" width="311" height="200" rx="12"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>

    <!-- Envelope Icon -->
    <g transform="translate(297.5, 226)">
      <circle cx="0" cy="0" r="14" stroke="#2563EB" stroke-width="1.2" fill="none"/>
      <g stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8" y="-6" width="16" height="12" rx="1"/>
        <polyline points="-8,-6 0,0 8,-6"/>
      </g>
    </g>

    <!-- Card Title -->
    <text x="297.5" y="258" text-anchor="middle"
          font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">Contact Information</text>

    <!-- Divider Line -->
    <line x1="172" y1="268" x2="423" y2="268" stroke="#E5E7EB" stroke-width="0.5"/>

    <!-- Contact Details -->
    <g text-anchor="middle">
      <text x="297.5" y="286" font-family="'Poppins', sans-serif" font-weight="600" font-size="9.5" fill="#111827">Bedant Arya Padhy</text>
      <text x="297.5" y="298" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#9CA3AF">Founder &amp; Developer, LeadFlow</text>
      
      <!-- List details -->
      <text x="297.5" y="324" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Email: bedant@leadflow.in</text>
      <text x="297.5" y="338" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Phone: +91 98765 43210</text>
      <text x="297.5" y="352" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Website: leadflow.in</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- PROFESSIONAL CALL TO ACTION                                      -->
  <!-- ================================================================ -->
  <g id="callToAction">
    <text x="297.5" y="426" text-anchor="middle"
          font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#2563EB">Ready to transform your recruitment operations?</text>
    <text x="297.5" y="442" text-anchor="middle"
          font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#6B7280">Let's schedule a kickoff call to align on system requirements and custom fields.</text>
  </g>

  <!-- Visual caption -->
  <text x="297.5" y="566"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#6B7280">Get in touch to schedule a kickoff call and launch the implementation process.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Moved upward)      -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="640" width="511" height="64" id="takeawayComponent">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        LeadFlow is ready to modernize Suryavanshi Finserv's recruitment operations with a secure, scalable, and fully supported platform.
      </div>
    </div>
  </foreignObject>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">17</text>
  </g>

</svg>
