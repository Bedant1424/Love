<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01–11 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 12</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Pricing &amp; Engagement</text>
    <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- SECTION HEADER — Reused from Components Library                  -->
  <!-- ================================================================ -->
  <g id="proposalSectionHeader">
    <text x="42" y="84"
          font-family="'Poppins', sans-serif"
          font-weight="700"
          font-size="24"
          fill="#111827">Pricing &amp; Engagement</text>
    <text x="42" y="102"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="9.5"
          fill="#6B7280">Transparent pricing tailored for Suryavanshi Finserv.</text>
  </g>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">LeadFlow is offered through a simple fixed-price engagement with no hidden fees or user-based licensing.</text>

  <!-- ================================================================ -->
  <!-- DOMINANT VISUAL: PRICING CARDS (3-COLUMN GRID)                   -->
  <!-- ================================================================ -->

  <!-- Card 1: What's Included -->
  <g id="pricingCard1" filter="url(#cardShadow)">
    <rect x="42" y="180" width="162" height="340" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon outline: Bullet check -->
    <g transform="translate(70, 208)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="8"/>
      <path d="M -3,0 L -1,2 L 3,-2"/>
    </g>
    <!-- Card Title -->
    <text x="58" y="242" font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">What's Included</text>
    <text x="58" y="254" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#9CA3AF">Full platform deliverables</text>
    <line x1="58" y1="262" x2="188" y2="262" stroke="#E5E7EB" stroke-width="0.5"/>
    
    <!-- Scannable Grouped Items -->
    <g font-family="'Inter', sans-serif">
      <!-- Group 1: Platform -->
      <text x="58" y="278" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#2563EB">Platform</text>
      <text x="58" y="290" font-size="7.5" fill="#111827">• Manager Dashboard</text>
      <text x="58" y="300" font-size="7.5" fill="#111827">• Intern calling workspace</text>
      <text x="58" y="310" font-size="7.5" fill="#111827">• Real-time analytics panel</text>
      
      <!-- Group 2: Setup -->
      <text x="58" y="332" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#2563EB">Setup</text>
      <text x="58" y="344" font-size="7.5" fill="#111827">• Custom subdomain setup</text>
      <text x="58" y="354" font-size="7.5" fill="#111827">• Supabase database config</text>
      <text x="58" y="364" font-size="7.5" fill="#111827">• Lead spreadsheet migration</text>
      
      <!-- Group 3: Training -->
      <text x="58" y="386" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#2563EB">Training</text>
      <text x="58" y="398" font-size="7.5" fill="#111827">• Intern calling onboarding</text>
      <text x="58" y="408" font-size="7.5" fill="#111827">• Manager oversight training</text>
      <text x="58" y="418" font-size="7.5" fill="#111827">• 2 Months included support</text>
    </g>
  </g>

  <!-- Card 2: Investment -->
  <g id="pricingCard2" filter="url(#cardShadow)">
    <rect x="216" y="180" width="162" height="340" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon outline: Card/Payment -->
    <g transform="translate(244, 208)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-5" width="16" height="10" rx="1.5"/>
      <line x1="-8" y1="-1" x2="8" y2="-1"/>
      <circle cx="-4" cy="2" r="1"/>
    </g>
    <!-- Card Title -->
    <text x="232" y="242" font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">Investment</text>
    <text x="232" y="254" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#9CA3AF">Simple, transparent costing</text>
    <line x1="232" y1="262" x2="362" y2="262" stroke="#E5E7EB" stroke-width="0.5"/>
    
    <!-- Cost details -->
    <!-- Phase 1 -->
    <text x="232" y="278" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#6B7280">Software Development</text>
    <text x="232" y="294" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#111827">₹20,000</text>
    
    <!-- Phase 2 -->
    <text x="232" y="320" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#6B7280">Setup &amp; Deployment</text>
    <text x="232" y="336" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#111827">₹5,000</text>
    
    <line x1="232" y1="352" x2="362" y2="352" stroke="#E5E7EB" stroke-width="0.5"/>
    
    <!-- Total Cost -->
    <text x="232" y="368" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#6B7280">Total Initial Cost</text>
    <text x="232" y="388" font-family="'Poppins', sans-serif" font-weight="700" font-size="18" fill="#2563EB">₹25,000</text>
    
    <line x1="232" y1="404" x2="362" y2="404" stroke="#E5E7EB" stroke-width="0.5"/>
    
    <!-- Support Benefit leading presentation -->
    <text x="232" y="422" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#10B981">2 Months Free Support</text>
    <text x="232" y="438" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#111827">₹2,000 / month thereafter</text>
    <text x="232" y="448" font-family="'Inter', sans-serif" font-weight="400" font-size="7" fill="#9CA3AF">Optional maintenance plan.</text>
    <text x="232" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="7" fill="#9CA3AF">Includes bug fixes &amp; updates.</text>
  </g>

  <!-- Card 3: Business Value -->
  <g id="pricingCard3" filter="url(#cardShadow)">
    <rect x="391" y="180" width="162" height="340" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon outline: Value trend -->
    <g transform="translate(419, 208)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6,4 L -2,0 L 2,2 L 6,-4"/>
      <polyline points="3,-4 6,-4 6,-1"/>
    </g>
    <!-- Card Title -->
    <text x="407" y="242" font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">Business Value</text>
    <text x="407" y="254" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#9CA3AF">Measurable business impact</text>
    <line x1="407" y1="262" x2="537" y2="262" stroke="#E5E7EB" stroke-width="0.5"/>
    
    <!-- Outcome-focused Value Highlights -->
    <g font-family="'Inter', sans-serif">
      <!-- Highlight 1: reduced manual work -->
      <text x="407" y="278" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Reduced Manual Work</text>
      <text x="407" y="288" font-size="7.5" fill="#6B7280">Saves hours daily by automating</text>
      <text x="407" y="298" font-size="7.5" fill="#6B7280">lead distribution and tracking.</text>
      
      <!-- Highlight 2: centralized visibility -->
      <text x="407" y="320" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Centralized Visibility</text>
      <text x="407" y="330" font-size="7.5" fill="#6B7280">Real-time dashboards show lead</text>
      <text x="407" y="340" font-size="7.5" fill="#6B7280">stages and team output instantly.</text>
      
      <!-- Highlight 3: accountability -->
      <text x="407" y="362" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Total Accountability</text>
      <text x="407" y="372" font-size="7.5" fill="#6B7280">Clear ownership for every lead</text>
      <text x="407" y="382" font-size="7.5" fill="#6B7280">prevents duplicates and leaks.</text>
      
      <!-- Highlight 4: operational efficiency -->
      <text x="407" y="404" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Operational Efficiency</text>
      <text x="407" y="414" font-size="7.5" fill="#6B7280">Interns focus entirely on calls</text>
      <text x="407" y="424" font-size="7.5" fill="#6B7280">instead of spreadsheet updates.</text>
      
      <!-- Highlight 5: predictable budgeting -->
      <text x="407" y="446" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Predictable Budgeting</text>
      <text x="407" y="456" font-size="7.5" fill="#6B7280">Fixed-cost rollout with zero</text>
      <text x="407" y="466" font-size="7.5" fill="#6B7280">per-user monthly licensing fees.</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- TRUST INDICATOR BADGE (Subtle callout below the cards)           -->
  <!-- ================================================================ -->
  <g id="trustBadge">
    <rect x="232.5" y="534" width="130" height="16" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.5"/>
    <text x="297.5" y="544.5" text-anchor="middle"
          font-family="'Poppins', sans-serif" font-weight="600" font-size="6.5" fill="#2563EB">✓ Fixed Implementation Cost</text>
  </g>

  <!-- Visual caption (Moved upward to improve vertical balance) -->
  <text x="297.5" y="570"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#6B7280">One transparent investment with no per-user licensing fees.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Moved upward)      -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="640" width="511" height="64" id="takeawayComponent">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        By eliminating per-seat licensing and deployment complexity, LeadFlow delivers immediate operational value and a rapid path to positive return on investment.
      </div>
    </div>
  </foreignObject>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">12</text>
  </g>

</svg>
