<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01–14 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 15</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Why LeadFlow</text>
    <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- SECTION HEADER — Reused from Components Library                  -->
  <!-- ================================================================ -->
  <g id="proposalSectionHeader">
    <text x="42" y="84"
          font-family="'Poppins', sans-serif"
          font-weight="700"
          font-size="24"
          fill="#111827">Why LeadFlow</text>
    <text x="42" y="102"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="9.5"
          fill="#6B7280">The logical next step for your recruitment operations.</text>
  </g>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">LeadFlow combines modern recruitment workflows with simple implementation, transparent pricing,</text>
  <text x="42" y="144"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">and ongoing support to create a dependable long-term solution.</text>

  <!-- ================================================================ -->
  <!-- DOMINANT VISUAL: OPERATIONAL COMPARISON (Height 220)              -->
  <!-- ================================================================ -->
  <g id="operationalComparison" filter="url(#cardShadow)">
    <!-- Container Card (y=180 to 400, height 220) -->
    <rect x="42" y="180" width="511" height="220" rx="12"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>

    <!-- Comparison Header Title -->
    <text x="297.5" y="202"
          text-anchor="middle"
          font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">Operational Comparison</text>

    <!-- Left Column (Current Recruitment Operations) -->
    <g id="currentOperations">
      <text x="64" y="224"
            font-family="'Poppins', sans-serif" font-weight="600" font-size="9.5" fill="#EF4444">Current Recruitment Operations</text>
      
      <!-- Bullet 1: Spreadsheet Icon -->
      <g transform="translate(64, 249)">
        <rect x="-4" y="-5" width="8" height="10" rx="1" stroke="#EF4444" stroke-width="1.1" fill="none"/>
        <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#EF4444" stroke-width="1"/>
        <line x1="-1" y1="-5" x2="-1" y2="5" stroke="#EF4444" stroke-width="1"/>
      </g>
      <text x="78" y="252" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Excel spreadsheets</text>
      
      <!-- Bullet 2: WhatsApp Chat Icon -->
      <g transform="translate(64, 269)">
        <rect x="-5" y="-4" width="10" height="8" rx="1" stroke="#EF4444" stroke-width="1.1" fill="none"/>
        <path d="M -3,4 L -5,7 L -1,4" stroke="#EF4444" stroke-width="1.1" fill="none"/>
      </g>
      <text x="78" y="272" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">WhatsApp coordination</text>
      
      <!-- Bullet 3: Clock Icon -->
      <g transform="translate(64, 289)">
        <circle cx="0" cy="0" r="5" stroke="#EF4444" stroke-width="1.1" fill="none"/>
        <polyline points="0,-3 0,0 2,0" stroke="#EF4444" stroke-width="1.1" fill="none"/>
      </g>
      <text x="78" y="292" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Manual reporting</text>
      
      <!-- Bullet 4: Duplicate Icon -->
      <g transform="translate(64, 309)">
        <rect x="-4" y="-4" width="6" height="6" rx="0.5" stroke="#EF4444" stroke-width="1.1" fill="none"/>
        <rect x="-1" y="-1" width="6" height="6" rx="0.5" stroke="#EF4444" stroke-width="1.1" fill="none"/>
      </g>
      <text x="78" y="312" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Duplicate work</text>
      
      <!-- Bullet 5: Warning Icon -->
      <g transform="translate(64, 329)">
        <polygon points="0,-5 -5,4 5,4" stroke="#EF4444" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
        <line x1="0" y1="-2" x2="0" y2="1" stroke="#EF4444" stroke-width="1.1"/>
        <circle cx="0" cy="3" r="0.5" fill="#EF4444"/>
      </g>
      <text x="78" y="332" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Limited visibility</text>
    </g>

    <!-- Right Column (LeadFlow Workflow) -->
    <g id="leadflowOperations">
      <text x="316" y="224"
            font-family="'Poppins', sans-serif" font-weight="600" font-size="9.5" fill="#2563EB">LeadFlow Solution</text>
      
      <!-- Bullet 1: Database Icon -->
      <g transform="translate(316, 249)">
        <ellipse cx="0" cy="-3" rx="5" ry="2" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <path d="M -5,-3 L -5,1 A 5,2 0 0,0 5,1 L 5,-3" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <path d="M -5,1 L -5,5 A 5,2 0 0,0 5,5 L 5,1" stroke="#2563EB" stroke-width="1.1" fill="none"/>
      </g>
      <text x="330" y="252" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Centralized workspace</text>
      
      <!-- Bullet 2: Eye Icon -->
      <g transform="translate(316, 269)">
        <circle cx="0" cy="0" r="5" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <circle cx="0" cy="0" r="1.8" fill="#2563EB"/>
      </g>
      <text x="330" y="272" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Real-time visibility</text>
      
      <!-- Bullet 3: User/Check Icon -->
      <g transform="translate(316, 289)">
        <path d="M -4,4 A 3,3 0 0,1 2,4 M -1,-1 A 1.8,1.8 0 1,1 -1,-1.1" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <path d="M 3,-1 L 5,1 L 8,-2" stroke="#2563EB" stroke-width="1.1" fill="none"/>
      </g>
      <text x="330" y="292" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Clear ownership</text>
      
      <!-- Bullet 4: Report/Analytics Icon -->
      <g transform="translate(316, 309)">
        <rect x="-5" y="-5" width="10" height="10" rx="1.5" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="#2563EB" stroke-width="1.1"/>
        <line x1="0" y1="0" x2="0" y2="5" stroke="#2563EB" stroke-width="1.1"/>
      </g>
      <text x="330" y="312" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Automated reporting</text>
      
      <!-- Bullet 5: Workflow Icon -->
      <g transform="translate(316, 329)">
        <circle cx="-3" cy="3" r="2" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <circle cx="3" cy="3" r="2" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <circle cx="0" cy="-3" r="2" stroke="#2563EB" stroke-width="1.1" fill="none"/>
        <path d="M 0,-1 L -3,1 M 0,-1 L 3,1" stroke="#2563EB" stroke-width="1.1"/>
      </g>
      <text x="330" y="332" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#4B5563">Structured workflows</text>
    </g>

    <!-- Vertical dashed divider -->
    <line x1="297.5" y1="218" x2="297.5" y2="380"
          stroke="#E5E7EB" stroke-width="0.75" stroke-dasharray="4 3"/>

    <!-- Central Transition Element (Strengthened & larger) -->
    <g opacity="0.85">
      <!-- Glow rings -->
      <circle cx="297.5" cy="290" r="24" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.18"/>
      <circle cx="297.5" cy="290" r="21" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.1"/>
      <!-- Main circle -->
      <circle cx="297.5" cy="290" r="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Strong arrow -->
      <g stroke="#2563EB" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 290,290 L 305,290"/>
        <path d="M 299,284 L 305,290 L 299,296"/>
      </g>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- SUPPORTING SECTION: CONFIDENCE CARDS (2x2 GRID)                  -->
  <!-- ================================================================ -->

  <!-- Row 1: y=416 to 472 (height 56) -->
  <!-- Card 1: Purpose-Built for Recruitment (x=42, width=249.5) -->
  <g id="confidenceCard1" filter="url(#cardShadow)">
    <rect x="42" y="416" width="249.5" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Target outline -->
    <g transform="translate(60, 444)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="0" cy="0" r="2" fill="#2563EB"/>
    </g>
    <text x="78" y="439" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Purpose-Built for Recruitment</text>
    <text x="78" y="451" font-family="'Inter', sans-serif" font-weight="400" font-size="7" fill="#6B7280">Designed specifically for recruitment operations.</text>
  </g>

  <!-- Card 2: Simple Implementation (x=303.5, width=249.5) -->
  <g id="confidenceCard2" filter="url(#cardShadow)">
    <rect x="303.5" y="416" width="249.5" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Calendar/Clock -->
    <g transform="translate(321.5, 444)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-6" width="12" height="12" rx="1.5"/>
      <line x1="-3" y1="-6" x2="-3" y2="-3"/>
      <line x1="3" y1="-6" x2="3" y2="-3"/>
    </g>
    <text x="339.5" y="439" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Simple Implementation</text>
    <text x="339.5" y="451" font-family="'Inter', sans-serif" font-weight="400" font-size="7" fill="#6B7280">Structured onboarding process and rapid deployment.</text>
  </g>

  <!-- Row 2: y=484 to 540 (height 56) -->
  <!-- Card 3: Transparent Pricing (x=42, width=249.5) -->
  <g id="confidenceCard3" filter="url(#cardShadow)">
    <rect x="42" y="484" width="249.5" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Tag -->
    <g transform="translate(60, 512)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-7" y="-5" width="14" height="10" rx="1"/>
      <line x1="-7" y1="-1" x2="7" y2="-1"/>
    </g>
    <text x="78" y="507" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Transparent Pricing</text>
    <text x="78" y="519" font-family="'Inter', sans-serif" font-weight="400" font-size="7" fill="#6B7280">Fixed-cost implementation model with no hidden fees.</text>
  </g>

  <!-- Card 4: Long-Term Partnership (x=303.5, width=249.5) -->
  <g id="confidenceCard4" filter="url(#cardShadow)">
    <rect x="303.5" y="484" width="249.5" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Handshake/Users -->
    <g transform="translate(321.5, 512)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -5,5 A 4,4 0 0,1 1,5 M -2,-2 A 2.2,2.2 0 1,1 -2,-2.1"/>
      <path d="M 3,0 L 5.5,2.5 L 9.5,-1.5"/>
    </g>
    <text x="339.5" y="507" font-family="'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#111827">Long-Term Partnership</text>
    <text x="339.5" y="519" font-family="'Inter', sans-serif" font-weight="400" font-size="7" fill="#6B7280">Reinforce continued support and future enhancements.</text>
  </g>

  <!-- Visual caption -->
  <text x="297.5" y="566"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#6B7280">Everything your recruitment team needs in one connected platform.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Moved upward)      -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="640" width="511" height="64" id="takeawayComponent">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        LeadFlow is more than software. It is a structured recruitment platform designed to simplify operations today while supporting future business growth.
      </div>
    </div>
  </foreignObject>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">15</text>
  </g>

</svg>
