<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842">
  <!--
    TAKEAWAY TEMPLATE — NATIVE SVG VERSION (v1.1)
    ==============================================
    
    This template defines the reusable Key Takeaway card component
    using pure native SVG elements. No foreignObject, no HTML, no CSS.
    
    COMPONENT STRUCTURE:
    - Background card: <rect> with rx=8, white fill, light border, card shadow
    - Blue accent bar: <rect> 3px wide on the left edge
    - Text content: <text> with <tspan> elements for line wrapping
    
    LAYOUT STANDARDS:
    - Width: 511 pt (aligned to L=42, R=553)
    - Height: 64 pt standard (can extend for longer text)
    - Border radius: 8 pt (secondary radius)
    - Left accent: 3px solid #2563EB
    - Font: Inter Medium 11pt, #111827, center-aligned
    
    POSITIONING:
    - Pages 02-11: y=722 (standard position)
    - Pages 12-17: y=640 (shifted up for taller content above)
    
    COMPATIBILITY:
    - Renders correctly in all SVG renderers
    - No browser-specific HTML/CSS dependencies
    - Compatible with Figma, Inkscape, Illustrator, Canva
  -->
  
  <!-- Example at y=722 -->
  <g id="takeawayComponent">
    <rect x="42" y="722" width="511" height="64" rx="8"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <rect x="42" y="724" width="3" height="60" rx="0" fill="#2563EB"/>
    <text x="297.5" y="758"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="500"
          font-size="11"
          fill="#111827">
      <tspan x="297.5" dy="0">Your takeaway message goes here. Keep it to one or two lines</tspan>
      <tspan x="297.5" dy="15.4">for best visual balance and readability.</tspan>
    </text>
  </g>
</svg>
