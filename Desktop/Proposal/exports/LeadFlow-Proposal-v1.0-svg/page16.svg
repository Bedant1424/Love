<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01–15 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 16</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Next Steps</text>
    <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- SECTION HEADER — Reused from Components Library                  -->
  <!-- ================================================================ -->
  <g id="proposalSectionHeader">
    <text x="42" y="84"
          font-family="'Poppins', sans-serif"
          font-weight="700"
          font-size="24"
          fill="#111827">Next Steps</text>
    <text x="42" y="102"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="9.5"
          fill="#6B7280">A simple, structured path to successful platform launch.</text>
  </g>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">LeadFlow follows a structured, fully supported implementation process to ensure minimal disruption</text>
  <text x="42" y="144"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">to your daily operations while aligning fields and onboarding your team for launch success.</text>

  <!-- ================================================================ -->
  <!-- DOMINANT VISUAL: IMPLEMENTATION SEQUENCE (4 STAGES)              -->
  <!-- ================================================================ -->
  <g id="implementationSequence" filter="url(#cardShadow)">
    <!-- Container Card (y=170 to 330, height 160) -->
    <rect x="42" y="170" width="511" height="160" rx="12"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>

    <!-- Title inside card -->
    <text x="297.5" y="196" text-anchor="middle"
          font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">Implementation Sequence</text>

    <!-- Connecting Timeline Line -->
    <line x1="74" y1="236" x2="521" y2="236" stroke="#2563EB" stroke-width="1.2"/>

    <!-- 1. Proposal Approval (cx=74) -->
    <g id="stage1">
      <circle cx="74" cy="236" r="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Icon: Check mark -->
      <g transform="translate(74, 236) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -3.5,0 L -1,2.5 L 3.5,-2"/>
      </g>
      <!-- Labels -->
      <text x="74" y="262" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Proposal</text>
      <text x="74" y="272" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Approval</text>
      <text x="74" y="288" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="6.5" fill="#6B7280">Confirm scope &amp; launch.</text>
    </g>

    <!-- 2. Project Kickoff (cx=223) -->
    <g id="stage2">
      <circle cx="223" cy="236" r="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Icon: Flag Outline -->
      <g transform="translate(223, 236) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -4,-4 L 4,0 L -4,4 Z M -4,-4 L -4,6"/>
      </g>
      <!-- Labels -->
      <text x="223" y="262" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Project</text>
      <text x="223" y="272" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Kickoff</text>
      <text x="223" y="288" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="6.5" fill="#6B7280">Align team &amp; timelines.</text>
    </g>

    <!-- 3. Dev & Training (cx=372) -->
    <g id="stage3">
      <circle cx="372" cy="236" r="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Icon: Code Screen Outline -->
      <g transform="translate(372, 236) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-5" y="-4" width="10" height="8" rx="1"/>
        <line x1="-5" y1="1" x2="5" y2="1"/>
      </g>
      <!-- Labels -->
      <text x="372" y="262" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Dev &amp;</text>
      <text x="372" y="272" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Training</text>
      <text x="372" y="288" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="6.5" fill="#6B7280">Build system &amp; onboard.</text>
    </g>

    <!-- 4. Go Live (cx=521) -->
    <g id="stage4">
      <circle cx="521" cy="236" r="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <!-- Icon: Rocket Outline -->
      <g transform="translate(521, 236)" fill="#2563EB">
        <polygon points="-3,-5 5,0 -3,5"/>
      </g>
      <!-- Labels -->
      <text x="521" y="262" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Go</text>
      <text x="521" y="272" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#111827">Live</text>
      <text x="521" y="288" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="6.5" fill="#6B7280">Deploy PWA production.</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- SUPPORTING SECTION: FRAMEWORK CARDS (3 CARDS)                    -->
  <!-- ================================================================ -->

  <!-- Card 1: Communication -->
  <g id="frameworkCard1" filter="url(#cardShadow)">
    <rect x="42" y="354" width="162" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Chat bubble outline -->
    <g transform="translate(70, 382) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-5" width="12" height="10" rx="1.5"/>
      <path d="M -4,5 L -6,8 L -2,5"/>
    </g>
    <!-- Content -->
    <text x="60" y="418" font-family="'Poppins', sans-serif" font-weight="600" font-size="10" fill="#111827">Communication</text>
    <text x="60" y="438" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Dedicated communication channel</text>
    <text x="60" y="450" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Direct engineer contact</text>
    <text x="60" y="462" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Weekly status reports</text>
  </g>

  <!-- Card 2: Project Timeline -->
  <g id="frameworkCard2" filter="url(#cardShadow)">
    <rect x="216" y="354" width="162" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Calendar outline -->
    <g transform="translate(244, 382) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-6" width="12" height="12" rx="1.5"/>
      <line x1="-3" y1="-6" x2="-3" y2="-3"/>
      <line x1="3" y1="-6" x2="3" y2="-3"/>
    </g>
    <!-- Content -->
    <text x="234" y="418" font-family="'Poppins', sans-serif" font-weight="600" font-size="10" fill="#111827">Project Timeline</text>
    <text x="234" y="438" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Structured implementation timeline</text>
    <text x="234" y="450" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Sprinted milestones</text>
    <text x="234" y="462" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Predictable timelines</text>
  </g>

  <!-- Card 3: Launch Support -->
  <g id="frameworkCard3" filter="url(#cardShadow)">
    <rect x="391" y="354" width="162" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Onboarding check outline -->
    <g transform="translate(419, 382) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -5,5 A 4,4 0 0,1 1,5 M -2,-2 A 2.2,2.2 0 1,1 -2,-2.1"/>
      <path d="M 3,0 L 5.5,2.5 L 9.5,-1.5"/>
    </g>
    <!-- Content -->
    <text x="409" y="418" font-family="'Poppins', sans-serif" font-weight="600" font-size="10" fill="#111827">Launch Support</text>
    <text x="409" y="438" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Full onboarding training</text>
    <text x="409" y="450" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Custom documentation</text>
    <text x="409" y="462" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">• Priority post-launch support</text>
  </g>

  <!-- Visual caption -->
  <text x="297.5" y="532"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">A predictable implementation framework ensures a seamless transition to LeadFlow.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Moved upward)      -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="640" width="511" height="64" id="takeawayComponent">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        A structured kickoff process eliminates deployment risk, ensuring your team has clear direction from day one.
      </div>
    </div>
  </foreignObject>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">16</text>
  </g>

</svg>
