<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01/02/03/04 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 05</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Introducing LeadFlow</text>
    <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- SECTION HEADER — Reused from Components Library                  -->
  <!-- ================================================================ -->
  <g id="proposalSectionHeader">
    <text x="42" y="84"
          font-family="'Poppins', sans-serif"
          font-weight="700"
          font-size="24"
          fill="#111827">Introducing LeadFlow</text>
    <text x="42" y="102"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="9.5"
          fill="#6B7280">One platform to centralize your recruitment operations.</text>
  </g>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">LeadFlow is a cloud-based Recruitment Operations Platform. It centralizes lead management,</text>
  <text x="42" y="144"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">assignments, and reporting into one workspace.</text>
  <text x="42" y="166"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">Accessible from any modern browser with a fast, app-like experience.</text>
  <text x="42" y="180"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">No installation required.</text>

  <!-- ================================================================ -->
  <!-- UI MOCKUP 01: LOGIN SCREEN (Dominant Visual)                     -->
  <!-- Browser-style window layout, centered horizontally               -->
  <!-- ================================================================ -->
  <g id="loginScreenMockup" filter="url(#cardShadow)">
    <!-- Browser outer frame -->
    <rect x="147.5" y="210" width="300" height="360" rx="12"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    
    <!-- Browser header bar (Height increased by 6pt) -->
    <path d="M 147.5,222 A 12,12 0 0 1 159.5,210 L 435.5,210 A 12,12 0 0 1 447.5,222 L 447.5,240 L 147.5,240 Z" fill="#F1F5F9"/>
    
    <!-- Window navigation dots (y adjusted to center in 30pt height) -->
    <circle cx="162" cy="225" r="3.5" fill="#EF4444"/>
    <circle cx="172" cy="225" r="3.5" fill="#F59E0B"/>
    <circle cx="182" cy="225" r="3.5" fill="#10B981"/>

    <!-- Separator -->
    <line x1="147.5" y1="240" x2="447.5" y2="240" stroke="#E5E7EB" stroke-width="0.75"/>

    <!-- Screen inner content (Slate 50 background, y and height adjusted) -->
    <rect x="148" y="240.75" width="299" height="328.5" rx="0" fill="#F8FAFC"/>

    <!-- Brand Logo inside browser (Scaled up by ~10%) -->
    <g transform="translate(0, 0)">
      <!-- Connected Node Icon -->
      <line x1="282.5" y1="266" x2="312.5" y2="266" stroke="#2563EB" stroke-width="1.8"/>
      <circle cx="280.5" cy="266" r="5" fill="#2563EB"/>
      <circle cx="314.5" cy="266" r="5" fill="#2563EB"/>
      
      <!-- Brand Title -->
      <text x="297.5" y="288"
            text-anchor="middle"
            font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#111827">LeadFlow</text>
    </g>

    <!-- Credentials Card -->
    <g filter="url(#cardShadow)">
      <rect x="167.5" y="310" width="260" height="210" rx="8"
            fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>

      <!-- Card Title -->
      <text x="182.5" y="334"
            font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#111827">Sign In</text>

      <!-- Email Address Field -->
      <rect x="182.5" y="348" width="230" height="26" rx="5"
            fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
      <!-- Email Icon (envelope) -->
      <rect x="190.5" y="356" width="12" height="8.5" rx="1.5" fill="none" stroke="#6B7280" stroke-width="1"/>
      <polyline points="190.5,357.5 196.5,361.5 202.5,357.5" fill="none" stroke="#6B7280" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="208.5" y="364"
            font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#9CA3AF">Email Address</text>

      <!-- Password Field -->
      <rect x="182.5" y="384" width="230" height="26" rx="5"
            fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
      <!-- Lock Icon -->
      <rect x="191.5" y="396" width="10" height="7" rx="1.5" fill="none" stroke="#6B7280" stroke-width="1"/>
      <path d="M193.5,396 L193.5,394 A3,3 0 0 1 199.5,394 L199.5,396" fill="none" stroke="#6B7280" stroke-width="1"/>
      <text x="208.5" y="400"
            font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#9CA3AF">Password</text>
      <!-- Dots representing filled password -->
      <circle cx="390" cy="397" r="1.5" fill="#9CA3AF"/>
      <circle cx="395" cy="397" r="1.5" fill="#9CA3AF"/>
      <circle cx="400" cy="397" r="1.5" fill="#9CA3AF"/>
      <circle cx="405" cy="397" r="1.5" fill="#9CA3AF"/>

      <!-- Sign In Action Button -->
      <rect x="182.5" y="422" width="230" height="26" rx="5"
            fill="#2563EB"/>
      <text x="297.5" y="438"
            text-anchor="middle"
            font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#FFFFFF">Sign In</text>

      <!-- Request Registration Link -->
      <text x="297.5" y="476"
            text-anchor="middle"
            font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Request access from your manager</text>
      <line x1="228" y1="480" x2="367" y2="480" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="1 1"/>
    </g>
  </g>

  <!-- Visual caption -->
  <text x="297.5" y="596"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">Managers and interns securely access personalized workspaces from any modern device.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Flexible y=722)    -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="722" width="511" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        LeadFlow replaces fragmented, offline tools with a single cloud platform accessible from any modern device.
      </div>
    </div>
  </foreignObject>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">05</text>
  </g>

</svg>
