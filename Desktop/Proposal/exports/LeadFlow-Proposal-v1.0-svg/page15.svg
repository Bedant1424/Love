<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 595 842"
     width="210mm" height="297mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>

    <!-- Card shadow — consistent with pages 01–14 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Takeaway card shadow — lighter -->
    <filter id="takeawayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.04" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- PAGE BACKGROUND — A4 Portrait, Slate 50                         -->
  <!-- ================================================================ -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 15</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Why LeadFlow</text>
    <line x1="42" y1="52" x2="553" y2="52" stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- SECTION HEADER — Reused from Components Library                  -->
  <!-- ================================================================ -->
  <g id="proposalSectionHeader">
    <text x="42" y="84"
          font-family="'Poppins', sans-serif"
          font-weight="700"
          font-size="24"
          fill="#111827">Why LeadFlow</text>
    <text x="42" y="102"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="9.5"
          fill="#6B7280">The logical next step for your recruitment operations.</text>
  </g>

  <!-- ================================================================ -->
  <!-- INTRODUCTION TEXT                                                 -->
  <!-- ================================================================ -->
  <text x="42" y="130"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">LeadFlow combines modern recruitment workflows with simple implementation, transparent pricing,</text>
  <text x="42" y="144"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="10"
        fill="#111827">and ongoing support to create a dependable long-term solution.</text>

  <!-- ================================================================ -->
  <!-- DOMINANT VISUAL: CONFIDENCE PILLARS (2x2 GRID OF DETAILED CARDS) -->
  <!-- ================================================================ -->

  <!-- Card 1: Purpose-Built for Recruitment (x=42, y=180, width=244, height=152) -->
  <g id="pillarCard1" filter="url(#cardShadow)">
    <rect x="42" y="180" width="244" height="152" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Target -->
    <g transform="translate(68, 212) scale(1.1)" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="0" cy="0" r="4"/>
      <circle cx="0" cy="0" r="1.2" fill="#2563EB"/>
    </g>
    <!-- Titles -->
    <text x="86" y="210" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#111827">Purpose-Built</text>
    <text x="86" y="222" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" fill="#2563EB">FOR RECRUITMENT OPERATIONS</text>
    <line x1="60" y1="234" x2="228" y2="234" stroke="#E5E7EB" stroke-width="0.5"/>
    <!-- Description -->
    <text x="60" y="254" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Replaces generic tools with</text>
    <text x="60" y="268" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">workflows optimized specifically for</text>
    <text x="60" y="282" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">intern calling, lead allocation,</text>
    <text x="60" y="296" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">and live manager oversight.</text>
  </g>

  <!-- Card 2: Simple Implementation (x=309, y=180, width=244, height=152) -->
  <g id="pillarCard2" filter="url(#cardShadow)">
    <rect x="309" y="180" width="244" height="152" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Lightning -->
    <g transform="translate(335, 212) scale(1.1)" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -2,-8 L 3,-2 L -1.5,-1 L 2,8 L -3,2 L 0.5,1 Z" fill="#EFF6FF"/>
    </g>
    <!-- Titles -->
    <text x="353" y="210" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#111827">Simple Rollout</text>
    <text x="353" y="222" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" fill="#2563EB">NO TECHNICAL OVERHEAD</text>
    <line x1="327" y1="234" x2="495" y2="234" stroke="#E5E7EB" stroke-width="0.5"/>
    <!-- Description -->
    <text x="327" y="254" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Our structured 6-stage roadmap</text>
    <text x="327" y="268" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">takes you from database config</text>
    <text x="327" y="282" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">and lead data migration to live</text>
    <text x="327" y="296" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">recruiter calling in weeks.</text>
  </g>

  <!-- Card 3: Transparent Pricing (x=42, y=356, width=244, height=152) -->
  <g id="pillarCard3" filter="url(#cardShadow)">
    <rect x="42" y="356" width="244" height="152" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Price Tag -->
    <g transform="translate(68, 388) scale(1.1)" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6,0 L -2,-5 L 5,-5 L 5,3 L -2,3 Z" fill="#EFF6FF"/>
      <circle cx="-1" cy="-2" r="1" fill="#2563EB"/>
    </g>
    <!-- Titles -->
    <text x="86" y="386" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#111827">Transparent Price</text>
    <text x="86" y="398" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" fill="#2563EB">ZERO PER-USER FEES</text>
    <line x1="60" y1="410" x2="228" y2="410" stroke="#E5E7EB" stroke-width="0.5"/>
    <!-- Description -->
    <text x="60" y="430" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Predictable fixed implementation</text>
    <text x="60" y="444" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">pricing with no monthly per-user</text>
    <text x="60" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">license fees. Scale your calling</text>
    <text x="60" y="472" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">team without expanding licensing costs.</text>
  </g>

  <!-- Card 4: Long-Term Partnership (x=309, y=356, width=244, height=152) -->
  <g id="pillarCard4" filter="url(#cardShadow)">
    <rect x="309" y="356" width="244" height="152" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <!-- Icon: Handshake/Link -->
    <g transform="translate(335, 388) scale(1.1)" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-3.5" cy="0" r="4.5" fill="#EFF6FF"/>
      <circle cx="3.5" cy="0" r="4.5"/>
    </g>
    <!-- Titles -->
    <text x="353" y="386" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#111827">Partner Ecosystem</text>
    <text x="353" y="398" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" fill="#2563EB">BUILT FOR FUTURE GROWTH</text>
    <line x1="327" y1="410" x2="495" y2="410" stroke="#E5E7EB" stroke-width="0.5"/>
    <!-- Description -->
    <text x="327" y="430" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">Includes 2 months of post-launch</text>
    <text x="327" y="444" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">support, regular maintenance,</text>
    <text x="327" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">and a structured roadmap for</text>
    <text x="327" y="472" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#4B5563">WhatsApp API and automated updates.</text>
  </g>

  <!-- Caption -->
  <text x="297.5" y="568"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">The dependable foundation for Suryavanshi Finserv's recruitment operations.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Moved upward)      -->
  <!-- ================================================================ -->
    <g id="takeawayComponent">
    <!-- Card background -->
    <rect x="42" y="640" width="511" height="64" rx="8"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"
          filter="url(#cardShadow)"/>
    <!-- Blue left accent bar -->
    <rect x="42" y="642" width="3" height="60" rx="0" fill="#2563EB"/>
    <!-- Takeaway text -->
    <text x="297.5" y="668.15"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="500"
          font-size="11"
          fill="#111827">
    <tspan x="297.5" dy="0">LeadFlow is more than software. It is a structured recruitment platform designed to</tspan>
    <tspan x="297.5" dy="15.4">simplify operations today while supporting future business growth.</tspan>
    </text>
  </g>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">15</text>
  </g>

</svg>
