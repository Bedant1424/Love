<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
  <defs>
    <!-- Slide shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="595" height="842" fill="#F8FAFC"/>

  <!-- ================================================================ -->
  <!-- PAGE HEADER — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <g id="proposalHeader">
    <text x="42" y="40"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="8"
          fill="#2563EB">LeadFlow</text>
    <text x="553" y="36"
          text-anchor="end"
          font-family="'Poppins', sans-serif"
          font-weight="600"
          font-size="7.5"
          fill="#111827">Page 17</text>
    <text x="553" y="46"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Thank You</text>
    <line x1="42" y1="52" x2="553" y2="52"
          stroke="#E5E7EB" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- HERO SECTION                                                     -->
  <!-- ================================================================ -->
  <text x="42" y="84"
        font-family="'Poppins', sans-serif"
        font-weight="700"
        font-size="24"
        fill="#111827">Thank You</text>
  <text x="42" y="102"
        font-family="'Inter', sans-serif"
        font-weight="400"
        font-size="9.5"
        fill="#475569">Let's build a modern, high-performance recruitment engine together.</text>

  <!-- ================================================================ -->
  <!-- LEFT COLUMN                                                      -->
  <!-- ================================================================ -->

  <!-- Card 1: Next Steps (y=140 to 320, height 180) -->
  <g id="nextStepsCard" filter="url(#cardShadow)">
    <rect x="42" y="140" width="244" height="180" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <text x="58" y="168" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#2563EB">Next Steps</text>
    <text x="58" y="184" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#475569">Schedule a kickoff call to finalize:</text>

    <!-- Checklist items with blue icon bullets scaled 10% -->
    <g transform="translate(58, 208) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="4.5" fill="#EFF6FF"/>
      <path d="M -1.5,0 L 0,1.5 L 1.8,-1.2"/>
    </g>
    <text x="76" y="211" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#334155">Detailed requirements mapping</text>

    <g transform="translate(58, 234) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="4.5" fill="#EFF6FF"/>
      <path d="M -1.5,0 L 0,1.5 L 1.8,-1.2"/>
    </g>
    <text x="76" y="237" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#334155">Custom metadata fields setup</text>

    <g transform="translate(58, 260) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="4.5" fill="#EFF6FF"/>
      <path d="M -1.5,0 L 0,1.5 L 1.8,-1.2"/>
    </g>
    <text x="76" y="263" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#334155">Onboarding &amp; rollout timeline</text>

    <text x="58" y="298" font-family="'Inter', sans-serif" font-style="italic" font-weight="400" font-size="7.5" fill="#475569">Ready to launch implementation.</text>
  </g>

  <!-- Card 2: Client Approval (y=344 to 580, height 236) -->
  <g id="approvalCard" filter="url(#cardShadow)">
    <rect x="42" y="344" width="244" height="236" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <text x="58" y="372" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#111827">Client Approval</text>
    <text x="58" y="388" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#475569">Subtle authorization to begin setup.</text>

    <!-- Representative Name -->
    <text x="58" y="420" font-family="'Inter', sans-serif" font-weight="500" font-size="7" fill="#475569">REPRESENTATIVE NAME</text>
    <line x1="58" y1="440" x2="226" y2="440" stroke="#CBD5E1" stroke-width="0.75"/>

    <!-- Signature -->
    <text x="58" y="474" font-family="'Inter', sans-serif" font-weight="500" font-size="7" fill="#475569">AUTHORIZED SIGNATURE</text>
    <line x1="58" y1="494" x2="226" y2="494" stroke="#CBD5E1" stroke-width="0.75"/>

    <!-- Date -->
    <text x="58" y="528" font-family="'Inter', sans-serif" font-weight="500" font-size="7" fill="#475569">DATE</text>
    <line x1="58" y1="548" x2="226" y2="548" stroke="#CBD5E1" stroke-width="0.75"/>
  </g>

  <!-- ================================================================ -->
  <!-- RIGHT COLUMN                                                     -->
  <!-- ================================================================ -->

  <!-- Card 3: Prepared By (y=140 to 580, height 440) -->
  <g id="preparedByCard" filter="url(#cardShadow)">
    <rect x="309" y="140" width="244" height="440" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.75"/>
    <text x="325" y="168" font-family="'Poppins', sans-serif" font-weight="600" font-size="10.5" fill="#111827">Prepared By</text>

    <!-- Developer Avatar Circle -->
    <circle cx="431" cy="226" r="28" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <!-- Avatar User Icon scaled 10% -->
    <g transform="translate(431, 226) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -8,11 C -8,7 -4,5 0,5 C 4,5 8,7 8,11"/>
      <circle cx="0" cy="-2" r="4.5"/>
    </g>

    <!-- Credentials -->
    <text x="431" y="278" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="11.5" fill="#111827">Bedant Arya Padhy</text>
    <text x="431" y="292" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#2563EB">Founder, LeadFlow</text>

    <line x1="339" y1="308" x2="523" y2="308" stroke="#E5E7EB" stroke-width="0.5"/>

    <!-- Personal message -->
    <text x="431" y="328" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">Thank you for the opportunity to partner</text>
    <text x="431" y="342" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">with Suryavanshi Finserv. We are excited</text>
    <text x="431" y="356" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">to build a modern, high-performance</text>
    <text x="431" y="370" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">recruitment engine for your team.</text>

    <line x1="339" y1="392" x2="523" y2="392" stroke="#E5E7EB" stroke-width="0.5"/>

    <!-- Contact details with icons scaled 10% -->
    <!-- Mail -->
    <g transform="translate(341, 419) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-4.5" width="12" height="9" rx="1"/>
      <path d="M -6,-4.5 L 0,0.5 L 6,-4.5"/>
    </g>
    <text x="356" y="422" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#334155">bedantarya0342@gmail.com</text>

    <!-- Phone -->
    <g transform="translate(341, 447) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -4.5,-2 C -4,-3.5 -2.5,-4 -1,-4 C 0.5,-4 1.5,-3 2.5,-1.5 C 2,-0.5 1,0.5 -1,0.5 C -3.5,0.5 -4.5,-0.5 -4.5,-2 Z"/>
      <path d="M -2,1 L -3,3 C -1,4.5 1,4.5 3,3 L 2,1"/>
    </g>
    <text x="356" y="450" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#334155">8895513563</text>

    <!-- LinkedIn -->
    <g transform="translate(341, 475) scale(1.1)" stroke="#2563EB" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-5.5" y="-5.5" width="11" height="11" rx="1.5"/>
      <line x1="-2.5" y1="-1" x2="-2.5" y2="3"/>
      <circle cx="-2.5" cy="-3.5" r="0.5" fill="#2563EB"/>
      <path d="M 0.5,3 L 0.5,0 C 0.5,-1 2.5,-1 2.5,0 L 2.5,3"/>
    </g>
    <text x="356" y="478" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#334155">linkedin.com/in/bedant-arya-padhy</text>
  </g>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library                     -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="640" width="511" height="64" id="takeawayComponent">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        LeadFlow is ready to modernize Suryavanshi Finserv's recruitment operations with a secure, scalable, and fully supported platform.
      </div>
    </div>
  </foreignObject>

  <!-- ================================================================ -->
  <!-- FOOTER — Reused from Components Library                          -->
  <!-- ================================================================ -->
  <g id="proposalFooter">
    <text x="297.5" y="822"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">Prepared exclusively for Suryavanshi Finserv. Confidential and proprietary.</text>
    <text x="553" y="822"
          text-anchor="end"
          font-family="'Inter', sans-serif"
          font-weight="400"
          font-size="7"
          fill="#9CA3AF">17</text>
  </g>

</svg>
