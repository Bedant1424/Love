<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadFlow Proposal - Interactive Presentation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0F172A;
            color: #E2E8F0;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #1E293B;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h1 {
            margin: 0;
            font-size: 18px;
            color: #38BDF8;
            font-weight: 700;
        }
        .sidebar-header p {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: #94A3B8;
        }
        .page-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .page-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-item:hover {
            background-color: #334155;
        }
        .page-item.active {
            background-color: #2563EB;
            color: white;
            font-weight: 600;
        }
        .page-num {
            font-size: 11px;
            opacity: 0.7;
        }
        .viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0F172A;
            position: relative;
        }
        .viewer-header {
            height: 60px;
            background-color: #1E293B;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .nav-btn {
            background-color: #334155;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background-color: #475569;
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .content-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
        }
        .svg-container {
            width: 100%;
            max-width: 540px;
            height: 90vh;
            max-height: 760px;
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>LeadFlow Proposal</h1>
            <p>Version v1.0 — Suryavanshi Finserv</p>
        </div>
        <div class="page-list" id="pageList"></div>
    </div>
    <div class="viewer">
        <div class="viewer-header">
            <button class="nav-btn" id="prevBtn" onclick="prevPage()">← Previous</button>
            <span id="pageIndicator" style="font-size: 14px; font-weight: 500;">Page 1 of 17</span>
            <button class="nav-btn" id="nextBtn" onclick="nextPage()">Next →</button>
        </div>
        <div class="content-area">
            <div class="svg-container">
                <iframe id="svgFrame" src="page01.svg"></iframe>
            </div>
        </div>
    </div>

    <script>
        const pages = [
            { num: "01", title: "Cover Page" },
            { num: "02", title: "Executive Summary" },
            { num: "03", title: "Current Challenges" },
            { num: "04", title: "Why Change?" },
            { num: "05", title: "Introducing LeadFlow" },
            { num: "06", title: "Manager Dashboard" },
            { num: "07", title: "Intern Workspace" },
            { num: "08", title: "Lead Management" },
            { num: "09", title: "Analytics Dashboard" },
            { num: "10", title: "Mobile PWA Experience" },
            { num: "11", title: "Implementation Journey" },
            { num: "12", title: "Pricing & Engagement" },
            { num: "13", title: "Return on Investment" },
            { num: "14", title: "Support & Partnership" },
            { num: "15", title: "Why LeadFlow" },
            { num: "16", title: "Next Steps" },
            { num: "17", title: "Thank You" }
        ];

        let currentPageIdx = 0;

        function init() {
            const listContainer = document.getElementById("pageList");
            pages.forEach((p, idx) => {
                const item = document.createElement("div");
                item.className = "page-item" + (idx === 0 ? " active" : "");
                item.id = `item-${idx}`;
                item.onclick = () => selectPage(idx);
                item.innerHTML = `
                    <span>${p.title}</span>
                    <span class="page-num">${p.num}</span>
                `;
                listContainer.appendChild(item);
            });
            updateControls();
        }

        function selectPage(idx) {
            document.getElementById(`item-${currentPageIdx}`).classList.remove("active");
            currentPageIdx = idx;
            document.getElementById(`item-${currentPageIdx}`).classList.add("active");
            
            const p = pages[currentPageIdx];
            document.getElementById("svgFrame").src = `page${p.num}.svg`;
            document.getElementById("pageIndicator").innerText = `${p.title} (${p.num}/17)`;
            
            updateControls();
            
            // Scroll list item into view if needed
            document.getElementById(`item-${idx}`).scrollIntoView({ block: 'nearest' });
        }

        function prevPage() {
            if (currentPageIdx > 0) {
                selectPage(currentPageIdx - 1);
            }
        }

        function nextPage() {
            if (currentPageIdx < pages.length - 1) {
                selectPage(currentPageIdx + 1);
            }
        }

        function updateControls() {
            document.getElementById("prevBtn").disabled = currentPageIdx === 0;
            document.getElementById("nextBtn").disabled = currentPageIdx === pages.length - 1;
        }

        // Add keyboard navigation
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") prevPage();
            if (e.key === "ArrowRight") nextPage();
        });

        window.onload = init;
    </script>
</body>
</html>
