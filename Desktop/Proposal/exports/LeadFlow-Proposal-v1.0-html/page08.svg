    <text x="371" y="433" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="6" fill="#2563EB">Assigned</text>
    <text x="420" y="434" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#111827">Sneha Reddy</text>
    <text x="486" y="434" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Jul 09</text>
    
    <line x1="138" y1="442" x2="528" y2="442" stroke="#F1F5F9" stroke-width="0.5"/>

    <!-- Row 6: Anita Deshmukh -->
    <text x="138" y="458" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" fill="#111827">Anita Deshmukh</text>
    <text x="214" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">CSV Upload</text>
    <text x="280" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Batch 02</text>
    <!-- Completed Badge -->
    <rect x="348" y="449" width="46" height="11" rx="2.5" fill="#D1FAE5"/>
    <text x="420" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#111827">Rahul Kumar</text>
    <text x="486" y="458" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Jul 08</text>
    
    <line x1="138" y1="466" x2="528" y2="466" stroke="#F1F5F9" stroke-width="0.5"/>

    <!-- Row 7: Alok Verma -->
    <text x="138" y="482" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" fill="#111827">Alok Verma</text>
    <text x="214" y="482" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">WhatsApp</text>
    <text x="280" y="482" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Batch 03</text>
    <!-- Call Back Badge -->
    <rect x="348" y="473" width="46" height="11" rx="2.5" fill="#FEF3C7"/>
    <text x="420" y="482" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#111827">Priya Sharma</text>
    <text x="486" y="482" font-family="'Inter', sans-serif" font-weight="400" font-size="7.5" fill="#6B7280">Jul 09</text>

    <!-- Specific fix: draw card status texts inside badges (since y coordinates inside row 1 / 6 / 7 text elements overlap or needed alignment) -->
    <!-- Rajesh Patel Completed Text -->
    <text x="371" y="337" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="6" fill="#065F46">Completed</text>
    <!-- Anita Deshmukh Completed Text -->
    <text x="371" y="457" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="6" fill="#065F46">Completed</text>
    <!-- Alok Verma Call Back Text -->
    <text x="371" y="481" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="6" fill="#D97706">Call Back</text>
  </g>

  <!-- Visual caption -->
  <text x="297.5" y="596"
        text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#475569">The centralized lead table replaces manual spreadsheets with a structured database.</text>

  <!-- ================================================================ -->
  <!-- KEY TAKEAWAY — Reused from Components Library (Flexible y=722)    -->
  <!-- ================================================================ -->
  <foreignObject x="42" y="722" width="511" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      background: #FFFFFF;
      border: 0.75px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 3px solid #2563EB;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      box-sizing: border-box;
      height: 100%;
    ">
      <div style="
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 11px;
        color: #111827;
        text-align: center;
        line-height: 1.4;
        max-width: 85%;
      ">
        Centralizing lead management in a unified database replaces manual distribution processes with absolute visibility and structural control.
      </div>
    </div>
  </foreignObject>

