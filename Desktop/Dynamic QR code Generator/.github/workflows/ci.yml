name: Foundation CI Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    name: Typecheck, Lint & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check
        run: npm run format:check

      - name: Strict Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Unit & Workers Integration Tests
        run: npm run test

      - name: Production Client Build
        run: npm run build
